<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact | Oreoluwa Idowu</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="container nav-container">
      <a href="index.html" class="logo">Oreoluwa<span>.Idowu</span></a>
      <nav aria-label="Primary Navigation">
        <ul class="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">About Me</a></li>
          <li><a href="projects.html">Projects</a></li>
          <li><a href="planner.html">Academic Planner</a></li>
          <li><a href="contact.html" class="active">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="container page-content">
    <h1>Get In Touch</h1>
    <p class="lead">Reach out for academic collaborations, data science projects, or venture partnerships.</p>

    <section class="contact-wrapper">
      <form id="contact-form" class="card contact-form" novalidate>
        <div id="form-feedback" class="form-feedback" role="alert"></div>

        <div class="form-group">
          <label for="full-name">Full Name</label>
          <input type="text" id="full-name" name="fullName" placeholder="Enter your full name" />
          <small class="error-text" id="name-error"></small>
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" />
          <small class="error-text" id="email-error"></small>
        </div>

        <div class="form-group">
          <label for="phone">Phone Number (Digits Only)</label>
          <input type="tel" id="phone" name="phone" placeholder="e.g., 08146213503" />
          <small class="error-text" id="phone-error"></small>
        </div>

        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="5" placeholder="Write your message here..."></textarea>
          <small class="error-text" id="message-error"></small>
        </div>

        <button type="submit" class="btn btn-primary">Send Message</button>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2026 Oreoluwa Idowu • Miva Open University (COS 106 Term Project)</p>
    </div>
  </footer>

  <script src="js/contact.js"></script>
</body>
</html>
